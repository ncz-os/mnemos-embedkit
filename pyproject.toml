[build-system]
requires = ["setuptools>=77"]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemos-embedkit"
version = "0.1.0a2"
description = "Open embedding devkit for Cix NPU, NVIDIA CUDA, and llama.cpp CPU runtimes"
authors = [{ name = "Jason Perlow", email = "jperlow@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
]

# Optional extras — install only what your host can use.
# Listed alphabetically by vendor; the order has no semantic meaning.
# The kit itself does not bundle vendor drivers; these extras pull
# the python bindings that talk to drivers the OS already provides.
[project.optional-dependencies]
cpu-llamacpp     = ["llama-cpp-python>=0.3"]
# Cix
npu-cix          = ["transformers>=4.40"]  # libnoe is supplied by the Cix OS image
# NVIDIA
gpu-nvidia-cuda  = ["onnxruntime-gpu>=1.18", "transformers>=4.40"]

# Bundled extras — convenience installs for common box classes.
# These do NOT prefer any vendor; they reflect what tends to be
# present on a given form factor.
all-cpu          = ["mnemos-embedkit[cpu-llamacpp]"]
all-x86-cuda     = ["mnemos-embedkit[cpu-llamacpp,gpu-nvidia-cuda]"]
all-arm-cix      = ["mnemos-embedkit[cpu-llamacpp,npu-cix]"]
all              = ["mnemos-embedkit[all-cpu,all-x86-cuda,all-arm-cix]"]

dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
embedkit-bench  = "embedkit.bench:main"
embedkit-doctor = "embedkit.doctor:main"

[project.urls]
Homepage = "https://github.com/ncz-os/mnemos-embedkit"
Repository = "https://github.com/ncz-os/mnemos-embedkit"
Issues = "https://github.com/ncz-os/mnemos-embedkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/embedkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
